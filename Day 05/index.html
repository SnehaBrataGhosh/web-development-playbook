<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <h1>Just a normal form</h1>
    <form action="post">
        <div>
            <label for="username">Enter ur user name </label>
            <input type="text" id="username" name="username" placeholder="Enter the username">
        </div>
        <div>
            <input type="radio" name="gender" id="male" value="male">
            <label for="male">Male</label>
            <input type="radio" name="gender" id="Female" value="Female">
            <label for="Female">Female</label>
        </div>

        <div>
            <input type="checkbox" name="subscribe" id="subscribe" value="yes">
            <label for="subscribe">Subscribe</label>
        </div>
        <div>
            <label for="comment">Enter ur thoughts</label><br>
            <textarea id="comment" name="comment" rows="4" cols="30"></textarea>
        </div>

        <div>
            <select name="Select fruits">
                <option value="app">Apple</option>
                <option value="ban">Banana</option>
                <option value="kiw">Kiwi</option>
            </select>
            
        </div>
    </form>
</body>
</html>
